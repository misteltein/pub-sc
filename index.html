<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <title>出荷管理スキャナ</title>
    <style>
      :root {
        color-scheme: light;
        --scan-primary-font-size: clamp(2.2rem, 9.6vw, 3.2rem);
        --scan-primary-line-height: 1.25;
        --history-display-font-size: clamp(2.8rem, 13vw, 5.2rem);
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        margin: 0;
        padding: 20px 16px 28px;
        background: #fff;
        color: #111;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        flex-direction: column;
        gap: 16px;
      }

      [hidden] {
        display: none !important;
      }

      .setup-heading,
      .topbar,
      .code-line,
      .history,
      .error-box {
        width: 100%;
        max-width: 640px;
      }

      .video-wrap,
      .scanbar {
        width: 100%;
        max-width: 960px;
      }

      .btn {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 12px 16px;
        background: #2563eb;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
      }

      #scanStart {
        width: 80vw;
        max-width: 80vw;
        font-size: var(--scan-primary-font-size);
        line-height: var(--scan-primary-line-height);
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .sub-btn {
        appearance: none;
        border: 1px solid #cbd5e1;
        border-radius: 999px;
        padding: 10px 14px;
        background: #fff;
        color: #334155;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
      }

      #settingsReset {
        font-size: 2rem;
        line-height: 1.1;
        padding: 14px 22px;
      }

      .sub-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .setup-heading {
        margin: 0;
        text-align: center;
        font-size: clamp(2rem, 9vw, 3.4rem);
        line-height: 1.1;
        font-weight: 900;
      }

      .video-wrap {
        --scan-live-zoom: 1;
        position: relative;
        display: none;
        overflow: hidden;
        border-radius: 12px;
        aspect-ratio: 4/3;
        background: #000;
        touch-action: none;
        user-select: none;
      }

      .video-wrap.show {
        display: block;
      }

      .video-wrap video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #000;
        transform: scale(var(--scan-live-zoom));
        transform-origin: center center;
      }

      .overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        border: 3px dashed rgba(255, 255, 255, 0.7);
        border-radius: 12px;
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35) inset;
        z-index: 2;
      }

      .scanbar {
        display: none;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
      }

      .scanbar.show {
        display: flex;
      }

      .scanbar[data-mode="config"] {
        justify-content: flex-end;
      }

      .scanbar[data-mode="config"] .zoom-controls {
        display: none;
      }

      .zoom-controls {
        flex: 1 1 260px;
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .zoom-label,
      .zoom-value {
        font-size: 2rem;
        line-height: 1.1;
        color: #374151;
        font-weight: 700;
        white-space: nowrap;
      }

      .zoom-value {
        min-width: 4.2em;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .zoom-slider {
        flex: 1 1 auto;
        width: 100%;
        min-width: 120px;
      }

      .code-line {
        display: block;
      }

      .code-heading {
        flex: 1 1 100%;
        font-size: var(--history-display-font-size);
        line-height: 1.05;
        font-weight: 900;
        margin: 0;
        word-break: break-word;
      }

      .history {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .history li {
        position: relative;
        border: 1px solid var(--history-border, #e5e7eb);
        border-left: 8px solid var(--history-accent, #94a3b8);
        border-radius: 12px;
        padding: 12px 14px;
        background: var(--history-bg, #f8fafc);
      }

      .history-main {
        display: flex;
        align-items: center;
        gap: 16px;
        min-width: 0;
      }

      .history-icon {
        flex: 0 0 auto;
        width: 1em;
        height: 1em;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        font-size: var(--history-display-font-size);
        font-weight: 900;
        line-height: 1;
      }

      .history-icon[data-kind="saving"],
      .history-icon[data-kind="queued"] {
        border: 0.12em solid rgba(148, 163, 184, 0.28);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: history-spin 0.8s linear infinite;
      }

      .history-body {
        color: #0f172a;
        min-width: 0;
        font-size: var(--history-display-font-size);
        font-weight: 800;
        line-height: 1.1;
        word-break: break-word;
      }

      .history-icon[data-kind="saved"]::before,
      .history-icon[data-kind="skipped"]::before {
        content: "✓";
      }

      .history-icon[data-kind="error"]::before {
        content: "☠";
      }

      .history li[data-kind="queued"] .history-icon {
        color: #2563eb;
        border-color: rgba(37, 99, 235, 0.22);
        border-top-color: #2563eb;
      }

      .history li[data-kind="error"] {
        border-color: #fecaca;
        border-left-color: #dc2626;
        background: #fff1f2;
      }

      .history li[data-kind="saving"] {
        border-color: #fde68a;
        border-left-color: #f59e0b;
        background: #fffbeb;
      }

      .history li[data-kind="queued"] {
        border-color: #bfdbfe;
        border-left-color: #2563eb;
        background: #eff6ff;
      }

      .history li[data-kind="skipped"] {
        border-color: #cbd5e1;
        border-left-color: #64748b;
        background: #f8fafc;
      }

      .history li[data-kind="saving"] .history-icon {
        color: #d97706;
        border-color: rgba(245, 158, 11, 0.24);
        border-top-color: #d97706;
      }

      .history li[data-kind="saved"] .history-icon {
        color: #15803d;
      }

      .history li[data-kind="skipped"] .history-icon {
        color: #475569;
      }

      .history li[data-kind="error"] .history-icon {
        color: #b91c1c;
      }

      @keyframes history-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .error-box {
        margin: 0;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #fecaca;
        background: #fff1f2;
        color: #b91c1c;
        font-size: 0.95rem;
        line-height: 1.4;
        white-space: pre-wrap;
      }

      @media (min-width: 720px) {
        .video-wrap {
          aspect-ratio: 16/9;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.js"></script>
  </head>
  <body>
    <h1 id="setupHeading" class="setup-heading" hidden>設定QRを読み取る</h1>

    <div id="topbar" class="topbar">
      <button id="scanStart" class="btn">バーコードを読み込む</button>
      <button id="settingsReset" type="button" class="sub-btn" hidden>
        設定QRを読み直す
      </button>
    </div>

    <input
      id="scanFileInput"
      type="file"
      accept="image/*"
      capture="environment"
      hidden
    />

    <div id="videoWrap" class="video-wrap">
      <video id="scanVideo" playsinline muted></video>
      <div class="overlay"></div>
    </div>

    <div id="scanBar" class="scanbar">
      <label class="zoom-controls" for="scanZoomRange">
        <span class="zoom-label">ズーム</span>
        <input
          id="scanZoomRange"
          class="zoom-slider"
          type="range"
          min="1"
          max="1.8"
          step="0.01"
          value="1"
        />
        <span id="scanZoomValue" class="zoom-value">1.00x</span>
      </label>
    </div>

    <div class="code-line" id="codeLine" hidden>
      <h2 id="codeHeading" class="code-heading"></h2>
    </div>

    <ul class="history" id="history"></ul>
    <p class="error-box" id="errorBox" hidden></p>

    <script>
      const DEPLOYMENT_ID_STORAGE_KEY = "fk-shipping-confirmation.deploymentId";
      const LEGACY_API_URL_STORAGE_KEY = "fk-shipping-confirmation.apiUrl";
      const PASSPHRASE_STORAGE_KEY = "fk-shipping-confirmation.passphrase";
      const LOCATION_NAME_STORAGE_KEY = "fk-shipping-confirmation.locationName";

      const $setupHeading = document.getElementById("setupHeading");
      const $topbar = document.getElementById("topbar");
      const $scanStart = document.getElementById("scanStart");
      const $settingsReset = document.getElementById("settingsReset");
      const $scanFileInput = document.getElementById("scanFileInput");
      const $videoWrap = document.getElementById("videoWrap");
      const $scanVideo = document.getElementById("scanVideo");
      const $scanBar = document.getElementById("scanBar");
      const $scanZoomRange = document.getElementById("scanZoomRange");
      const $scanZoomValue = document.getElementById("scanZoomValue");
      const $codeLine = document.getElementById("codeLine");
      const $codeHeading = document.getElementById("codeHeading");
      const $history = document.getElementById("history");
      const $errorBox = document.getElementById("errorBox");

      let currentStream = null;
      let running = false;
      let liveScanTimerId = null;
      let liveScanSessionId = 0;
      let currentScanMode = "";
      let liveScanCandidateCode = "";
      let liveScanCandidateCount = 0;
      let liveScanCandidateLastAt = 0;
      let liveScanCodeLastSeenAt = 0;
      let configQrCandidateText = "";
      let configQrCandidateCount = 0;
      let configQrCandidateLastAt = 0;
      let liveScanViewZoom = 1;
      let lastAcceptedOid = "";
      let activeSavingOids = new Set();
      let scanQueue = [];
      let scanQueueProcessing = false;
      let saveBatchStartTimerId = null;
      let audioContext = null;
      let deploymentId = "";
      let passphrase = "";
      let locationName = "";

      const LIVE_SCAN_CONFIRM_INTERVAL_MS = 100;
      const LIVE_SCAN_CONFIRM_COUNT = 3;
      const LIVE_SCAN_CONFIRM_TIMEOUT_MS = 1200;
      const LIVE_SCAN_FRAME_MAX_EDGE_PX = 960;
      const FILE_SCAN_FRAME_MAX_EDGE_PX = 1280;
      const BARCODE_SCAN_JPEG_QUALITY = 0.92;
      const LIVE_SCAN_VIEW_ZOOM_MIN = 1;
      const LIVE_SCAN_VIEW_ZOOM_MAX = 1.8;
      const LIVE_SCAN_VIEW_ZOOM_STEP = 0.01;
      const CONFIG_QR_CONFIRM_INTERVAL_MS = 120;
      const CONFIG_QR_CONFIRM_COUNT = 2;
      const CONFIG_QR_CONFIRM_TIMEOUT_MS = 1500;
      const CONFIG_QR_SEPARATOR = ";";
      const LOCATION_NAMES = Object.freeze(["玉川", "緑ヶ丘", "中目黒", "豊橋", "京都", "自由が丘"]);
      const LOCATION_CODES = Object.freeze({
        TM: "玉川",
        M: "緑ヶ丘",
        NM: "中目黒",
        TY: "豊橋",
        KY: "京都",
        JY: "自由が丘",
      });
      const SAVE_BATCH_START_DELAY_MS = 1000;
      const SAVE_MAX_ATTEMPTS = 3;
      const SAVE_RETRY_DELAY_MS = 1000;
      const SCANNED_OID_PATTERN = /^\d{4}-\d{3}$/;
      const HISTORY_COLOR_PALETTE = [
        { bg: "#eff6ff", border: "#bfdbfe", accent: "#2563eb" },
        { bg: "#f0fdf4", border: "#bbf7d0", accent: "#16a34a" },
        { bg: "#fdf2f8", border: "#fbcfe8", accent: "#db2777" },
        { bg: "#ecfeff", border: "#a5f3fc", accent: "#0891b2" },
        { bg: "#f5f3ff", border: "#ddd6fe", accent: "#7c3aed" },
        { bg: "#fff7ed", border: "#fed7aa", accent: "#ea580c" },
        { bg: "#f0fdfa", border: "#99f6e4", accent: "#0d9488" },
        { bg: "#f7fee7", border: "#d9f99d", accent: "#65a30d" },
      ];

      let historyColorDeck = [];

      function show(el, on) {
        el.classList.toggle("show", !!on);
      }

      function setHidden(el, on) {
        el.hidden = !!on;
      }

      function clearError() {
        $errorBox.textContent = "";
        setHidden($errorBox, true);
      }

      function showError(message) {
        $errorBox.textContent = message;
        setHidden($errorBox, false);
      }

      function hasSavedSettings() {
        return !!(deploymentId && passphrase && locationName);
      }

      function setScanStatus(_message) {
        // Status text is intentionally kept out of the UI; history rows show progress.
      }

      function wait(ms) {
        return new Promise((resolve) => window.setTimeout(resolve, ms));
      }

      function getNextHistoryColor() {
        if (!historyColorDeck.length) {
          historyColorDeck = [...HISTORY_COLOR_PALETTE];
          for (let i = historyColorDeck.length - 1; i > 0; i -= 1) {
            const j = Math.floor(Math.random() * (i + 1));
            [historyColorDeck[i], historyColorDeck[j]] = [
              historyColorDeck[j],
              historyColorDeck[i],
            ];
          }
        }
        return historyColorDeck.pop();
      }

      function applyHistoryColor(item) {
        const color = getNextHistoryColor();
        item.style.setProperty("--history-bg", color.bg);
        item.style.setProperty("--history-border", color.border);
        item.style.setProperty("--history-accent", color.accent);
        item.dataset.hasHistoryColor = "true";
      }

      function ensureHistoryColor(item, kind) {
        if (kind === "saving" || kind === "queued" || kind === "error") return;
        if (item.dataset.hasHistoryColor === "true") return;
        applyHistoryColor(item);
      }

      function setHistoryIconKind(icon, kind) {
        if (!icon) return;
        icon.dataset.kind = kind;
      }

      function normalizeDeploymentId(value) {
        const text = String(value || "").trim();
        const match = text.match(/\/macros\/s\/([^/]+)\/exec(?:\?|$)/);
        return match ? match[1] : text;
      }

      function normalizeLocationName(value) {
        const normalized = String(value || "").trim();
        if (LOCATION_CODES[normalized]) {
          return LOCATION_CODES[normalized];
        }
        return LOCATION_NAMES.includes(normalized) ? normalized : "";
      }

      function buildApiUrl() {
        return `https://script.google.com/macros/s/${encodeURIComponent(deploymentId)}/exec`;
      }

      function loadSettings() {
        deploymentId = normalizeDeploymentId(
          localStorage.getItem(DEPLOYMENT_ID_STORAGE_KEY) ||
            localStorage.getItem(LEGACY_API_URL_STORAGE_KEY),
        );
        passphrase = String(localStorage.getItem(PASSPHRASE_STORAGE_KEY) || "").trim();
        locationName = normalizeLocationName(
          localStorage.getItem(LOCATION_NAME_STORAGE_KEY),
        );
      }

      function saveSettings(nextDeploymentId, nextPassphrase, nextLocationName) {
        deploymentId = normalizeDeploymentId(nextDeploymentId);
        passphrase = String(nextPassphrase || "").trim();
        locationName = normalizeLocationName(nextLocationName);
        localStorage.setItem(DEPLOYMENT_ID_STORAGE_KEY, deploymentId);
        localStorage.removeItem(LEGACY_API_URL_STORAGE_KEY);
        localStorage.setItem(PASSPHRASE_STORAGE_KEY, passphrase);
        localStorage.setItem(LOCATION_NAME_STORAGE_KEY, locationName);
      }

      function syncSettingsUi() {
        const needsQrLogin = !hasSavedSettings();
        setHidden($setupHeading, !needsQrLogin);
        setHidden($topbar, needsQrLogin);
        setHidden($settingsReset, needsQrLogin);
      }

      function setScanningUi(scanning) {
        $scanStart.disabled = scanning;
        $settingsReset.disabled = scanning;
      }

      function setScanBarMode(mode) {
        if (!mode) {
          delete $scanBar.dataset.mode;
          return;
        }
        $scanBar.dataset.mode = mode;
      }

      function clampLiveScanZoom(value) {
        const numericValue = Number(value);
        if (!Number.isFinite(numericValue)) return liveScanViewZoom;
        return Math.min(
          LIVE_SCAN_VIEW_ZOOM_MAX,
          Math.max(LIVE_SCAN_VIEW_ZOOM_MIN, numericValue),
        );
      }

      function formatLiveScanZoom(value) {
        return `${clampLiveScanZoom(value).toFixed(2)}x`;
      }

      function syncLiveScanZoomUi() {
        const zoomValue = clampLiveScanZoom(liveScanViewZoom);
        liveScanViewZoom = zoomValue;
        $videoWrap.style.setProperty("--scan-live-zoom", String(zoomValue));
        $scanZoomRange.value = zoomValue.toFixed(2);
        $scanZoomValue.textContent = formatLiveScanZoom(zoomValue);
      }

      function setLiveScanZoom(value) {
        const nextZoom = clampLiveScanZoom(value);
        if (Math.abs(nextZoom - liveScanViewZoom) < LIVE_SCAN_VIEW_ZOOM_STEP / 2) {
          syncLiveScanZoomUi();
          return;
        }
        liveScanViewZoom = nextZoom;
        syncLiveScanZoomUi();
      }

      function normalizeDisplayCode(code) {
        return String(code || "")
          .replace(/[！-～]/g, (s) =>
            String.fromCharCode(s.charCodeAt(0) - 0xfee0),
          )
          .replace(/[‐‑‒–—―ー−]/g, "-")
          .replace(/　/g, " ")
          .trim()
          .replace(/[^0-9-]/g, "");
      }

      function resetLiveScanConfirmation() {
        liveScanCandidateCode = "";
        liveScanCandidateCount = 0;
        liveScanCandidateLastAt = 0;
      }

      function resetLiveScanState() {
        resetLiveScanConfirmation();
        liveScanCodeLastSeenAt = 0;
      }

      function resetConfigQrState() {
        configQrCandidateText = "";
        configQrCandidateCount = 0;
        configQrCandidateLastAt = 0;
      }

      function setLiveScanReadyStatus() {
        setScanStatus("バーコードを枠内に合わせてください");
        resetLiveScanState();
      }

      function setConfigQrReadyStatus() {
        setScanStatus("設定QRをカメラに合わせてください");
        resetConfigQrState();
      }

      function getLiveScanTargetAspectRatio() {
        const rect = $videoWrap.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          return rect.width / rect.height;
        }
        return 4 / 3;
      }

      function getBarcodeSourceSize(source) {
        return {
          width: source.videoWidth || source.naturalWidth || source.width || 0,
          height: source.videoHeight || source.naturalHeight || source.height || 0,
        };
      }

      function scaleSizeToMaxEdge(width, height, maxEdgePx) {
        if (!width || !height) {
          return { width: 0, height: 0 };
        }
        const scale = Math.min(1, maxEdgePx / Math.max(width, height));
        return {
          width: Math.max(1, Math.round(width * scale)),
          height: Math.max(1, Math.round(height * scale)),
        };
      }

      function renderBarcodeSourceToCanvas(
        source,
        canvas,
        ctx,
        maxEdgePx,
        targetAspectRatio = null,
        zoomScale = 1,
      ) {
        const { width, height } = getBarcodeSourceSize(source);
        if (!width || !height) return false;

        let sourceX = 0;
        let sourceY = 0;
        let sourceWidth = width;
        let sourceHeight = height;

        if (targetAspectRatio && targetAspectRatio > 0) {
          const sourceAspectRatio = width / height;
          if (sourceAspectRatio > targetAspectRatio) {
            sourceWidth = height * targetAspectRatio;
            sourceX = (width - sourceWidth) / 2;
          } else if (sourceAspectRatio < targetAspectRatio) {
            sourceHeight = width / targetAspectRatio;
            sourceY = (height - sourceHeight) / 2;
          }
        }

        if (zoomScale > 1) {
          const zoomedWidth = sourceWidth / zoomScale;
          const zoomedHeight = sourceHeight / zoomScale;
          sourceX += (sourceWidth - zoomedWidth) / 2;
          sourceY += (sourceHeight - zoomedHeight) / 2;
          sourceWidth = zoomedWidth;
          sourceHeight = zoomedHeight;
        }

        const scaled = scaleSizeToMaxEdge(sourceWidth, sourceHeight, maxEdgePx);
        if (!scaled.width || !scaled.height) return false;

        if (canvas.width !== scaled.width || canvas.height !== scaled.height) {
          canvas.width = scaled.width;
          canvas.height = scaled.height;
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        ctx.drawImage(
          source,
          sourceX,
          sourceY,
          sourceWidth,
          sourceHeight,
          0,
          0,
          canvas.width,
          canvas.height,
        );
        return true;
      }

      function scheduleLiveScanTick(fn, delay = 0) {
        if (liveScanTimerId) {
          clearTimeout(liveScanTimerId);
        }
        liveScanTimerId = window.setTimeout(() => {
          liveScanTimerId = null;
          void fn();
        }, delay);
      }

      function clearStaleLiveScanCandidate(now = performance.now()) {
        if (!liveScanCandidateCode) return;
        if (now - liveScanCandidateLastAt <= LIVE_SCAN_CONFIRM_TIMEOUT_MS) return;
        setLiveScanReadyStatus();
      }

      function clearMissingLiveCode(now = performance.now()) {
        if (!liveScanCodeLastSeenAt) return;
        if (now - liveScanCodeLastSeenAt <= LIVE_SCAN_CONFIRM_TIMEOUT_MS) return;
        setLiveScanReadyStatus();
      }

      function confirmLiveScanCode(code, now = performance.now()) {
        const normalized = normalizeDisplayCode(code);
        if (!normalized) return "";
        if (normalized === lastAcceptedOid || isProcessingOrQueued(normalized)) {
          liveScanCodeLastSeenAt = now;
          return "";
        }
        liveScanCodeLastSeenAt = now;

        const isExpired =
          liveScanCandidateCode &&
          now - liveScanCandidateLastAt > LIVE_SCAN_CONFIRM_TIMEOUT_MS;
        if (normalized !== liveScanCandidateCode || isExpired) {
          liveScanCandidateCode = normalized;
          liveScanCandidateCount = 1;
          liveScanCandidateLastAt = now;
          setScanStatus(
            `同じ結果を確認中… ${liveScanCandidateCount}/${LIVE_SCAN_CONFIRM_COUNT}`,
          );
          return "";
        }

        if (now - liveScanCandidateLastAt < LIVE_SCAN_CONFIRM_INTERVAL_MS) {
          return "";
        }

        liveScanCandidateCount += 1;
        liveScanCandidateLastAt = now;
        if (liveScanCandidateCount >= LIVE_SCAN_CONFIRM_COUNT) {
          return normalized;
        }

        setScanStatus(
          `同じ結果を確認中… ${liveScanCandidateCount}/${LIVE_SCAN_CONFIRM_COUNT}`,
        );
        return "";
      }

      function parseConfigQrPayload(text) {
        const rawText = String(text || "").trim();
        const parts = rawText.split(CONFIG_QR_SEPARATOR);
        if (parts.length !== 3) {
          throw new Error("設定QRの形式が不正です。");
        }

        const nextDeploymentId = normalizeDeploymentId(parts[0]);
        const nextPassphrase = String(parts[1] || "").trim();
        const nextLocationName = normalizeLocationName(parts[2]);

        if (!nextDeploymentId) {
          throw new Error("設定QRに GAS デプロイ ID が含まれていません。");
        }

        if (!nextPassphrase) {
          throw new Error("設定QRに passphrase が含まれていません。");
        }

        if (!nextLocationName) {
          throw new Error("設定QRに有効な拠点名が含まれていません。");
        }

        return {
          deploymentId: nextDeploymentId,
          passphrase: nextPassphrase,
          locationName: nextLocationName,
        };
      }

      function confirmConfigQrText(text, now = performance.now()) {
        const normalized = String(text || "").trim();
        if (!normalized) return "";

        const isExpired =
          configQrCandidateText &&
          now - configQrCandidateLastAt > CONFIG_QR_CONFIRM_TIMEOUT_MS;

        if (normalized !== configQrCandidateText || isExpired) {
          configQrCandidateText = normalized;
          configQrCandidateCount = 1;
          configQrCandidateLastAt = now;
          return "";
        }

        if (now - configQrCandidateLastAt < CONFIG_QR_CONFIRM_INTERVAL_MS) {
          return "";
        }

        configQrCandidateCount += 1;
        configQrCandidateLastAt = now;
        if (configQrCandidateCount >= CONFIG_QR_CONFIRM_COUNT) {
          return normalized;
        }

        return "";
      }

      async function startCamera() {
        if (!navigator.mediaDevices?.getUserMedia) {
          return false;
        }
        stopCamera();
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false,
        });
        $scanVideo.srcObject = currentStream;
        await $scanVideo.play();
        return true;
      }

      function stopCamera() {
        if (liveScanTimerId) {
          clearTimeout(liveScanTimerId);
          liveScanTimerId = null;
        }
        if (currentStream) {
          currentStream.getTracks().forEach((track) => track.stop());
          currentStream = null;
        }
        if ($scanVideo.srcObject) {
          $scanVideo.srcObject = null;
        }
      }

      function applyConfigQrSettings(payload) {
        saveSettings(payload.deploymentId, payload.passphrase, payload.locationName);
        clearError();
        stopLiveScan();
        syncSettingsUi();
      }

      function addHistory(kind, message) {
        const item = document.createElement("li");
        item.dataset.kind = kind;
        ensureHistoryColor(item, kind);

        const main = document.createElement("div");
        main.className = "history-main";

        const icon = document.createElement("span");
        icon.className = "history-icon";
        icon.setAttribute("aria-hidden", "true");
        setHistoryIconKind(icon, kind);

        const body = document.createElement("div");
        body.className = "history-body";
        body.textContent = message;

        main.append(icon, body);
        item.append(main);
        $history.prepend(item);
        return item;
      }

      function updateHistoryItem(item, kind, message) {
        if (!item) return;
        item.dataset.kind = kind;
        ensureHistoryColor(item, kind);
        const icon = item.querySelector(".history-icon");
        const body = item.querySelector(".history-body");
        setHistoryIconKind(icon, kind);
        if (body) {
          body.textContent = message;
        }
      }

      function setCurrentOid(oid) {
        if (!oid) {
          if (!hasSavedSettings()) {
            $codeHeading.textContent = "";
            setHidden($codeLine, true);
            return;
          }
          $codeHeading.textContent = "WAITING";
          setHidden($codeLine, false);
          return;
        }
        $codeHeading.textContent = oid;
        setHidden($codeLine, false);
      }

      async function ensureAudioReady() {
        if (!audioContext) {
          const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextCtor) return;
          audioContext = new AudioContextCtor();
        }
        if (audioContext.state === "suspended") {
          await audioContext.resume();
        }
      }

      async function playBeep() {
        if (!audioContext) return;

        const now = audioContext.currentTime;
        const noiseDuration = 0.14;
        const noiseBuffer = audioContext.createBuffer(
          1,
          Math.floor(audioContext.sampleRate * noiseDuration),
          audioContext.sampleRate,
        );
        const noiseData = noiseBuffer.getChannelData(0);

        for (let i = 0; i < noiseData.length; i += 1) {
          noiseData[i] = Math.random() * 2 - 1;
        }

        const noise = audioContext.createBufferSource();
        const highpass = audioContext.createBiquadFilter();
        const noiseGain = audioContext.createGain();

        noise.buffer = noiseBuffer;
        highpass.type = "highpass";
        highpass.frequency.setValueAtTime(900, now);
        noiseGain.gain.setValueAtTime(0.0001, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.42, now + 0.006);
        noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + noiseDuration);
        noise.connect(highpass);
        highpass.connect(noiseGain);
        noiseGain.connect(audioContext.destination);
        noise.start(now);
        noise.stop(now + noiseDuration);

        const body = audioContext.createOscillator();
        const bodyGain = audioContext.createGain();
        body.type = "triangle";
        body.frequency.setValueAtTime(185, now);
        body.frequency.exponentialRampToValueAtTime(120, now + 0.09);
        bodyGain.gain.setValueAtTime(0.0001, now);
        bodyGain.gain.exponentialRampToValueAtTime(0.2, now + 0.005);
        bodyGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.11);
        body.connect(bodyGain);
        bodyGain.connect(audioContext.destination);
        body.start(now);
        body.stop(now + 0.12);
      }

      async function callApi(action, params = {}) {
        if (!deploymentId) {
          throw new Error("GAS デプロイ ID が未設定です。");
        }
        if (!passphrase) {
          throw new Error("passphrase が未設定です。");
        }
        if (!locationName) {
          throw new Error("拠点名が未設定です。");
        }

        const payload = new URLSearchParams({
          action,
          passphrase,
          locationName,
          ...params,
        });

        const response = await fetch(`${buildApiUrl()}?${payload.toString()}`, {
          method: "GET",
          redirect: "follow",
        });

        const text = await response.text();
        return JSON.parse(text);
      }

      async function callBatchScanApi(oids) {
        if (!deploymentId) {
          throw new Error("GAS デプロイ ID が未設定です。");
        }
        if (!passphrase) {
          throw new Error("passphrase が未設定です。");
        }
        if (!locationName) {
          throw new Error("拠点名が未設定です。");
        }

        const payload = new URLSearchParams({
          action: "scan_batch",
          passphrase,
          locationName,
          oids: JSON.stringify(oids),
        });

        const response = await fetch(buildApiUrl(), {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8",
          },
          body: payload.toString(),
          redirect: "follow",
        });

        const text = await response.text();
        return JSON.parse(text);
      }

      function getQueueSuffix() {
        return scanQueue.length ? `（待ち ${scanQueue.length} 件）` : "";
      }

      function hasQueuedOid(oid) {
        return scanQueue.some((item) => item.oid === oid);
      }

      function hasActiveSavingOid(oid) {
        return activeSavingOids.has(oid);
      }

      function isProcessingOrQueued(oid) {
        return hasActiveSavingOid(oid) || hasQueuedOid(oid);
      }

      function clearSaveBatchStartTimer() {
        if (!saveBatchStartTimerId) return;
        clearTimeout(saveBatchStartTimerId);
        saveBatchStartTimerId = null;
      }

      function scheduleSaveBatchStart() {
        if (scanQueueProcessing || saveBatchStartTimerId || !scanQueue.length) return;
        saveBatchStartTimerId = window.setTimeout(() => {
          saveBatchStartTimerId = null;
          if (scanQueueProcessing || !scanQueue.length) return;
          void processScanQueue();
        }, SAVE_BATCH_START_DELAY_MS);
      }

      function onCodeDetected(code) {
        const oid = String(code || "").trim();
        if (!SCANNED_OID_PATTERN.test(oid)) {
          return;
        }

        if (oid === lastAcceptedOid || isProcessingOrQueued(oid)) {
          return;
        }

        setCurrentOid(oid);
        clearError();
        const queueItem = {
          oid,
          historyItem: addHistory("queued", oid),
        };
        scanQueue.push(queueItem);
        void playBeep();
        setScanStatus(`キューに追加しました: ${oid}${getQueueSuffix()}`);
        scheduleSaveBatchStart();
      }

      async function processScanQueue() {
        if (scanQueueProcessing) return;
        if (!scanQueue.length) return;
        clearSaveBatchStartTimer();
        scanQueueProcessing = true;
        try {
          while (scanQueue.length) {
            const batchItems = scanQueue.splice(0, scanQueue.length);
            batchItems.forEach(({ oid, historyItem }) => {
              activeSavingOids.add(oid);
              updateHistoryItem(historyItem, "saving", oid);
            });
            await saveQueuedBatch(batchItems);
            batchItems.forEach(({ oid }) => {
              activeSavingOids.delete(oid);
            });
          }
        } finally {
          scanQueueProcessing = false;
          activeSavingOids = new Set();
          if (scanQueue.length) {
            void processScanQueue();
          }
        }
      }

      function applyBatchScanResults(batchItems, results) {
        if (!Array.isArray(results) || results.length !== batchItems.length) {
          throw new Error("unexpected scan_batch response");
        }

        results.forEach((result, index) => {
          const item = batchItems[index];
          const resultOid = normalizeDisplayCode(result && result.oid);
          if (!item || resultOid !== item.oid) {
            throw new Error("scan_batch result order mismatch");
          }

          lastAcceptedOid = item.oid;
          if (result.skipped) {
            updateHistoryItem(item.historyItem, "skipped", item.oid);
            return;
          }

          if (result.saved === true) {
            updateHistoryItem(item.historyItem, "saved", item.oid);
            return;
          }

          throw new Error(`unexpected scan_batch item: ${JSON.stringify(result).slice(0, 200)}`);
        });
      }

      async function saveQueuedBatch(batchItems) {
        const oids = batchItems.map((item) => item.oid);
        clearError();

        try {
          let lastError = null;
          for (let attempt = 1; attempt <= SAVE_MAX_ATTEMPTS; attempt += 1) {
            batchItems.forEach(({ oid, historyItem }) => {
              updateHistoryItem(historyItem, "saving", oid);
            });
            setScanStatus(`まとめて登録しています… ${oids.length}件${getQueueSuffix()}`);

            try {
              const response = await callBatchScanApi(oids);
              if (!response.ok) {
                throw new Error(response.message || "API error");
              }
              applyBatchScanResults(batchItems, response.results);
              setScanStatus(`登録しました: ${oids.length}件`);
              return;
            } catch (error) {
              lastError = error;
              if (attempt >= SAVE_MAX_ATTEMPTS) {
                break;
              }
              setScanStatus(`登録に失敗しました。再試行します… ${oids.length}件`);
              await wait(SAVE_RETRY_DELAY_MS);
            }
          }

          throw lastError || new Error("API error");
        } catch (error) {
          showError(error.message || String(error));
          setScanStatus(`登録に失敗しました: ${oids.length}件`);
          batchItems.forEach(({ oid, historyItem }) => {
            if (historyItem) {
              updateHistoryItem(historyItem, "error", oid);
              return;
            }
            addHistory("error", oid);
          });
        }
      }

      async function startScanCode() {
        if (!hasSavedSettings()) {
          syncSettingsUi();
          void startConfigQrSetup();
          return;
        }

        clearError();
        setScanningUi(true);
        setScanBarMode("barcode");
        setCurrentOid("");
        setScanStatus("カメラを起動しています…");
        resetLiveScanState();
        currentScanMode = "barcode";

        try {
          await ensureAudioReady();
          const cameraReady = await startCamera();
          if (!cameraReady) {
            throw new Error("camera start failed");
          }
          running = true;
          show($videoWrap, true);
          show($scanBar, true);
          await startLiveScan();
        } catch (error) {
          console.error(error);
          stopLiveScan();
          setScanningUi(false);
          showError(
            "ライブスキャンを開始できませんでした。画像選択での読み取りに切り替えます。",
          );
          openScanFilePicker();
        }
      }

      function openScanFilePicker() {
        $scanFileInput.value = "";
        $scanFileInput.click();
      }

      async function startConfigQrSetup() {
        clearError();
        syncSettingsUi();
        setScanningUi(true);
        setScanBarMode("config");
        setCurrentOid("");
        setScanStatus("設定QRを読み取っています…");
        resetConfigQrState();
        currentScanMode = "config";

        try {
          const cameraReady = await startCamera();
          if (!cameraReady) {
            throw new Error("camera start failed");
          }

          running = true;
          show($videoWrap, true);
          show($scanBar, false);
          await startConfigQrScan();
        } catch (error) {
          console.error(error);
          stopLiveScan();
          showError(
            "設定QRを読み取れませんでした。カメラ権限と対応ブラウザを確認してください。",
          );
        }
      }

      function stopLiveScan() {
        running = false;
        currentScanMode = "";
        activeSavingOids = new Set();
        scanQueue = [];
        scanQueueProcessing = false;
        clearSaveBatchStartTimer();
        liveScanSessionId += 1;
        resetLiveScanState();
        resetConfigQrState();
        stopCamera();
        show($videoWrap, false);
        show($scanBar, false);
        setScanBarMode("");
        setScanningUi(false);
        setCurrentOid("");
        setScanStatus("停止しました");
      }

      async function supportsBarcodeDetectorCode39() {
        if (!("BarcodeDetector" in window)) {
          return false;
        }
        if (typeof window.BarcodeDetector.getSupportedFormats !== "function") {
          return true;
        }
        const formats = await window.BarcodeDetector.getSupportedFormats();
        return Array.isArray(formats) && formats.includes("code_39");
      }

      async function supportsBarcodeDetectorQrCode() {
        if (!("BarcodeDetector" in window)) {
          return false;
        }
        if (typeof window.BarcodeDetector.getSupportedFormats !== "function") {
          return true;
        }
        const formats = await window.BarcodeDetector.getSupportedFormats();
        return Array.isArray(formats) && formats.includes("qr_code");
      }

      async function startLiveScan() {
        const sessionId = ++liveScanSessionId;
        if (await supportsBarcodeDetectorCode39()) {
          await runBarcodeDetectorLiveScan(sessionId);
          return;
        }
        await runQuaggaLiveScan(sessionId);
      }

      async function runBarcodeDetectorLiveScan(sessionId) {
        let detector = null;
        try {
          detector = new window.BarcodeDetector({ formats: ["code_39"] });
        } catch (error) {
          console.error(error);
          await runQuaggaLiveScan(sessionId);
          return;
        }

        const canvas = document.createElement("canvas");
        const ctx =
          canvas.getContext("2d", { willReadFrequently: true }) ||
          canvas.getContext("2d");
        if (!ctx) {
          throw new Error("canvas context unavailable");
        }

        setScanStatus("バーコードを枠内に合わせてください");
        const tick = async () => {
          if (!running) return;
          if (sessionId !== liveScanSessionId) return;

          clearStaleLiveScanCandidate();
          clearMissingLiveCode();
          if (
            renderBarcodeSourceToCanvas(
              $scanVideo,
              canvas,
              ctx,
              LIVE_SCAN_FRAME_MAX_EDGE_PX,
              getLiveScanTargetAspectRatio(),
              liveScanViewZoom,
            )
          ) {
            try {
              const codes = await detector.detect(canvas);
              const code = codes?.[0]?.rawValue || "";
              if (code) {
                const confirmedCode = confirmLiveScanCode(code);
                if (confirmedCode) {
                  resetLiveScanConfirmation();
                  onCodeDetected(confirmedCode);
                }
              } else {
                setLiveScanReadyStatus();
              }
            } catch (error) {
              console.error(error);
            }
          }

          if (!running) return;
          if (sessionId !== liveScanSessionId) return;
          scheduleLiveScanTick(tick, LIVE_SCAN_CONFIRM_INTERVAL_MS);
        };

        scheduleLiveScanTick(tick);
      }

      async function startConfigQrScan() {
        if (!(await supportsBarcodeDetectorQrCode())) {
          throw new Error("qr_code detector unavailable");
        }

        const detector = new window.BarcodeDetector({ formats: ["qr_code"] });
        const sessionId = ++liveScanSessionId;
        setConfigQrReadyStatus();

        const tick = async () => {
          if (!running) return;
          if (currentScanMode !== "config") return;
          if (sessionId !== liveScanSessionId) return;

          try {
            const codes = await detector.detect($scanVideo);
            const code = codes?.[0]?.rawValue || "";
            if (code) {
              const confirmedText = confirmConfigQrText(code);
              if (confirmedText) {
                const payload = parseConfigQrPayload(confirmedText);
                applyConfigQrSettings(payload);
                return;
              }
            } else {
              setConfigQrReadyStatus();
            }
          } catch (error) {
            console.error(error);
          }

          if (!running) return;
          if (currentScanMode !== "config") return;
          if (sessionId !== liveScanSessionId) return;
          scheduleLiveScanTick(tick, CONFIG_QR_CONFIRM_INTERVAL_MS);
        };

        scheduleLiveScanTick(tick);
      }

      async function runQuaggaLiveScan(sessionId) {
        if (typeof Quagga === "undefined" || !Quagga.decodeSingle) {
          throw new Error("Quagga unavailable");
        }

        const canvas = document.createElement("canvas");
        const ctx =
          canvas.getContext("2d", { willReadFrequently: true }) ||
          canvas.getContext("2d");
        if (!ctx) {
          throw new Error("canvas context unavailable");
        }

        setScanStatus("バーコードを枠内に合わせてください");
        const tick = async () => {
          if (!running) return;
          if (sessionId !== liveScanSessionId) return;

          clearStaleLiveScanCandidate();
          clearMissingLiveCode();
          if (
            renderBarcodeSourceToCanvas(
              $scanVideo,
              canvas,
              ctx,
              LIVE_SCAN_FRAME_MAX_EDGE_PX,
              getLiveScanTargetAspectRatio(),
              liveScanViewZoom,
            )
          ) {
            try {
              const code = await detectCodeByQuaggaCanvas(canvas);
              if (code) {
                const confirmedCode = confirmLiveScanCode(code);
                if (confirmedCode) {
                  resetLiveScanConfirmation();
                  onCodeDetected(confirmedCode);
                }
              } else {
                setLiveScanReadyStatus();
              }
            } catch (error) {
              console.error(error);
            }
          }

          if (!running) return;
          if (sessionId !== liveScanSessionId) return;
          scheduleLiveScanTick(tick, LIVE_SCAN_CONFIRM_INTERVAL_MS);
        };

        scheduleLiveScanTick(tick);
      }

      async function detectCodeByQuaggaCanvas(canvas) {
        const src = canvas.toDataURL("image/jpeg", BARCODE_SCAN_JPEG_QUALITY);
        return await detectCodeByQuaggaSrc(src);
      }

      async function detectCodeByQuaggaSrc(src) {
        if (typeof Quagga === "undefined" || !Quagga.decodeSingle) {
          return "";
        }
        return await new Promise((resolve) => {
          Quagga.decodeSingle(
            {
              src,
              numOfWorkers: 0,
              inputStream: { size: 1280 },
              decoder: {
                readers: ["code_39_reader"],
              },
              locate: true,
            },
            (res) => resolve(res?.codeResult?.code || ""),
          );
        });
      }

      async function detectCodeByQuagga(file) {
        const imageUrl = URL.createObjectURL(file);
        try {
          const image = await loadImageElement(imageUrl);
          const canvas = document.createElement("canvas");
          const ctx =
            canvas.getContext("2d", { willReadFrequently: true }) ||
            canvas.getContext("2d");
          if (!ctx) {
            throw new Error("canvas context unavailable");
          }
          const rendered = renderBarcodeSourceToCanvas(
            image,
            canvas,
            ctx,
            FILE_SCAN_FRAME_MAX_EDGE_PX,
          );
          if (!rendered) {
            return "";
          }
          return await detectCodeByQuaggaCanvas(canvas);
        } finally {
          URL.revokeObjectURL(imageUrl);
        }
      }

      function loadImageElement(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error("image load failed"));
          img.src = src;
        });
      }

      $scanStart.addEventListener("click", () => {
        void startScanCode();
      });

      $settingsReset.addEventListener("click", () => {
        deploymentId = "";
        passphrase = "";
        locationName = "";
        localStorage.removeItem(DEPLOYMENT_ID_STORAGE_KEY);
        localStorage.removeItem(LEGACY_API_URL_STORAGE_KEY);
        localStorage.removeItem(PASSPHRASE_STORAGE_KEY);
        localStorage.removeItem(LOCATION_NAME_STORAGE_KEY);
        syncSettingsUi();
        void startConfigQrSetup();
      });

      $scanZoomRange.addEventListener("input", (event) => {
        setLiveScanZoom(event.target.value);
      });

      $scanFileInput.addEventListener("change", async (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        clearError();
        try {
          const code = await detectCodeByQuagga(file);
          if (!code) {
            showError("バーコードを検出できませんでした。");
            return;
          }
          onCodeDetected(code);
        } catch (error) {
          showError(error.message || String(error));
        }
      });

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
          stopLiveScan();
        }
      });

      loadSettings();
      syncLiveScanZoomUi();
      setScanningUi(false);
      syncSettingsUi();
      setCurrentOid("");
      if (!hasSavedSettings()) {
        void startConfigQrSetup();
      }
    </script>
  </body>
</html>
